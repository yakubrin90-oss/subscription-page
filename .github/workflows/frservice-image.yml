name: FRService image

# Собственная сборка форка в ghcr.io. Апстримные build-and-push*.yml не трогаем —
# они завязаны на секреты Remnawave (Telegram, их реестр) и в форке всё равно
# не заработают. Отключить их можно в Actions → соответствующий workflow → Disable.

on:
  push:
    tags:
      - 'frs-*'
  workflow_dispatch:

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dockerfile не собирает фронтенд, а копирует готовый frontend/dist —
      # поэтому собираем его здесь, до docker build.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx vite build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
